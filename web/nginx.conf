# Mappatura del cookie melpis_lang verso la rispettiva pagina di login
map $cookie_melpis_lang $auth_login_redirect {
    default "/accedi/";
    "en"    "/en/login/";
    "es"    "/es/iniciar-sesion/";
    "fr"    "/fr/connexion/";
    "de"    "/de/anmelden/";
}

server {
    listen 80;
    server_name _;
    absolute_redirect off;

    # Landing su "/" — dashboard sotto "/app/" (stesso dominio: cookie
    # same-origin per il BFF, nessun CORS).
    root /usr/share/nginx/html;
    index index.html;

    include /etc/nginx/conf.d/security-headers.conf;

    # Compressione: app.js+style.css ~150KB non compressi pesano sul first load.
    gzip on;
    gzip_comp_level 5;
    gzip_min_length 256;
    gzip_proxied any;
    gzip_vary on;
    gzip_types
        text/plain
        text/css
        text/javascript
        application/javascript
        application/json
        image/svg+xml;

    location = / {
        try_files /index.html =404;
    }

    # Clean URL per le pagine legali italiane (/privacy/ -> privacy.html)
    location = /privacy     { return 301 /privacy/$is_args$args; }
    location = /termini     { return 301 /termini/$is_args$args; }
    location = /cookie      { return 301 /cookie/$is_args$args; }
    location = /privacy/    { root /run/melpis-legal; try_files /privacy.html =404; }
    location = /termini/    { root /run/melpis-legal; try_files /termini.html =404; }
    location = /cookie/     { root /run/melpis-legal; try_files /cookie.html =404; }

    # Clean URL per le pagine legali multilingua
    location = /en/privacy           { return 301 /en/privacy/$is_args$args; }
    location = /en/terms             { return 301 /en/terms/$is_args$args; }
    location = /en/cookies           { return 301 /en/cookies/$is_args$args; }
    location = /es/privacidad        { return 301 /es/privacidad/$is_args$args; }
    location = /es/terminos          { return 301 /es/terminos/$is_args$args; }
    location = /es/cookies           { return 301 /es/cookies/$is_args$args; }
    location = /fr/confidentialite   { return 301 /fr/confidentialite/$is_args$args; }
    location = /fr/conditions        { return 301 /fr/conditions/$is_args$args; }
    location = /fr/cookies           { return 301 /fr/cookies/$is_args$args; }
    location = /de/datenschutz       { return 301 /de/datenschutz/$is_args$args; }
    location = /de/agb               { return 301 /de/agb/$is_args$args; }
    location = /de/cookies           { return 301 /de/cookies/$is_args$args; }

    # Rendered legal pages are the only legal files served.  The templates are
    # deliberately outside the docroot and direct template filenames stay 404.
    location = /en/privacy/          { root /run/melpis-legal; try_files /en/privacy/index.html =404; }
    location = /en/terms/            { root /run/melpis-legal; try_files /en/terms/index.html =404; }
    location = /en/cookies/          { root /run/melpis-legal; try_files /en/cookies/index.html =404; }
    location = /es/privacidad/       { root /run/melpis-legal; try_files /es/privacidad/index.html =404; }
    location = /es/terminos/         { root /run/melpis-legal; try_files /es/terminos/index.html =404; }
    location = /es/cookies/          { root /run/melpis-legal; try_files /es/cookies/index.html =404; }
    location = /fr/confidentialite/  { root /run/melpis-legal; try_files /fr/confidentialite/index.html =404; }
    location = /fr/conditions/       { root /run/melpis-legal; try_files /fr/conditions/index.html =404; }
    location = /fr/cookies/          { root /run/melpis-legal; try_files /fr/cookies/index.html =404; }
    location = /de/datenschutz/      { root /run/melpis-legal; try_files /de/datenschutz/index.html =404; }
    location = /de/agb/              { root /run/melpis-legal; try_files /de/agb/index.html =404; }
    location = /de/cookies/          { root /run/melpis-legal; try_files /de/cookies/index.html =404; }

    # Pagine root multilingua
    location = /en { return 301 /en/$is_args$args; }
    location = /es { return 301 /es/$is_args$args; }
    location = /fr { return 301 /fr/$is_args$args; }
    location = /de { return 301 /de/$is_args$args; }

    # Pagine di accesso e registrazione dedicate italiane
    location = /accedi      { return 301 /accedi/$is_args$args; }
    location = /accedi/     { try_files /login.html =404; }
    location = /registrati  { return 301 /registrati/$is_args$args; }
    location = /registrati/ { try_files /register.html =404; }

    # Pagine di accesso e registrazione multilingua
    location = /en/login             { return 301 /en/login/$is_args$args; }
    location = /en/login/            { try_files /en/login/index.html =404; }
    location = /en/signup            { return 301 /en/signup/$is_args$args; }
    location = /en/signup/           { try_files /en/signup/index.html =404; }
    location = /es/iniciar-sesion    { return 301 /es/iniciar-sesion/$is_args$args; }
    location = /es/iniciar-sesion/   { try_files /es/iniciar-sesion/index.html =404; }
    location = /es/registro          { return 301 /es/registro/$is_args$args; }
    location = /es/registro/         { try_files /es/registro/index.html =404; }
    location = /fr/connexion         { return 301 /fr/connexion/$is_args$args; }
    location = /fr/connexion/        { try_files /fr/connexion/index.html =404; }
    location = /fr/inscription       { return 301 /fr/inscription/$is_args$args; }
    location = /fr/inscription/      { try_files /fr/inscription/index.html =404; }
    location = /de/anmelden          { return 301 /de/anmelden/$is_args$args; }
    location = /de/anmelden/         { try_files /de/anmelden/index.html =404; }
    location = /de/registrieren      { return 301 /de/registrieren/$is_args$args; }
    location = /de/registrieren/     { try_files /de/registrieren/index.html =404; }

    # Pagine verticali di settore italiane
    location = /settori/ristoranti         { return 301 /settori/ristoranti/$is_args$args; }
    location = /settori/ristoranti/        { try_files /settori/ristoranti/index.html =404; }
    location = /settori/saloni-bellezza    { return 301 /settori/saloni-bellezza/$is_args$args; }
    location = /settori/saloni-bellezza/   { try_files /settori/saloni-bellezza/index.html =404; }
    location = /settori/studi-medici       { return 301 /settori/studi-medici/$is_args$args; }
    location = /settori/studi-medici/      { try_files /settori/studi-medici/index.html =404; }
    location = /settori/hotel              { return 301 /settori/hotel/$is_args$args; }
    location = /settori/hotel/             { try_files /settori/hotel/index.html =404; }

    # Pagine verticali di settore multilingua
    location /en/industries/         { try_files $uri $uri/ $uri/index.html =404; }
    location /es/sectores/           { try_files $uri $uri/ $uri/index.html =404; }
    location /fr/secteurs/           { try_files $uri $uri/ $uri/index.html =404; }
    location /de/branchen/           { try_files $uri $uri/ $uri/index.html =404; }

    # Pagina prezzi dedicata italiana
    location = /prezzi                 { return 301 /prezzi/$is_args$args; }
    location = /prezzi/                { try_files /prezzi/index.html =404; }

    # Pagine prezzi multilingua
    location = /en/pricing           { return 301 /en/pricing/$is_args$args; }
    location = /en/pricing/          { try_files /en/pricing/index.html =404; }
    location = /es/precios           { return 301 /es/precios/$is_args$args; }
    location = /es/precios/          { try_files /es/precios/index.html =404; }
    location = /fr/tarifs            { return 301 /fr/tarifs/$is_args$args; }
    location = /fr/tarifs/           { try_files /fr/tarifs/index.html =404; }
    location = /de/preise            { return 301 /de/preise/$is_args$args; }
    location = /de/preise/           { try_files /de/preise/index.html =404; }

    # Documentazione e Help Center italiana
    location = /documentazione/inizia-da-qui/cos-e-melpis  { return 301 /documentazione/$is_args$args; }
    location = /documentazione/inizia-da-qui/cos-e-melpis/ { return 301 /documentazione/$is_args$args; }
    location /documentazione/ {
        try_files $uri $uri/ $uri/index.html =404;
    }
    location = /documentazione {
        return 301 /documentazione/$is_args$args;
    }

    # Documentazione multilingua
    location = /en/documentation     { return 301 /en/documentation/$is_args$args; }
    location /en/documentation/      { try_files $uri $uri/ $uri/index.html =404; }
    location = /es/documentacion     { return 301 /es/documentacion/$is_args$args; }
    location /es/documentacion/      { try_files $uri $uri/ $uri/index.html =404; }
    location = /fr/documentation     { return 301 /fr/documentation/$is_args$args; }
    location /fr/documentation/      { try_files $uri $uri/ $uri/index.html =404; }
    location = /de/dokumentation     { return 301 /de/dokumentation/$is_args$args; }
    location /de/dokumentation/      { try_files $uri $uri/ $uri/index.html =404; }

    # File di traduzione JSON per dashboard e client (/locales/{lang}/{ns}.json)
    location ^~ /locales/ {
        alias /usr/share/nginx/html/locales/;
        include /etc/nginx/conf.d/security-headers.conf;
        expires 1h;
        add_header Cache-Control "public, max-age=3600, must-revalidate";
        add_header Access-Control-Allow-Origin *;
    }

    # Dashboard: solo per utenti autenticati con cookie di sessione (wa_at o __Host-wa_at).
    # Se il cookie manca, redirect HTTP 302 immediato a pagina login localizzata ($auth_login_redirect).
    location ^~ /app/ {
        if ($http_cookie !~* "(?:^|;\s*)(?:__Host-)?wa_at=[^;]+") {
            return 302 "$auth_login_redirect?next=$uri#next=$request_uri";
        }
        root /usr/share/nginx/html;
        index index.html;
        try_files $uri $uri/ @app_shell;
    }
    location @app_shell {
        if ($uri ~* \.[^/]+$) {
            return 404;
        }
        rewrite ^ /app/index.html last;
    }
    location = /app {
        return 301 /app/$is_args$args;
    }

    # Proxy /api verso il container API (nome servizio compose): rende il
    # sito completamente autonomo su un solo host anche fuori da Traefik
    # (locale/staging). In produzione dietro Traefik la rotta /api può
    # continuare a puntare direttamente al container api: questa location
    # resta semplicemente inutilizzata.
    # Bounded local indexing can take up to 600 seconds. Keep its HTTP response
    # available through this proxy; normal API paths retain their 60s timeout.
    location ^~ /api/documenti/ {
        client_max_body_size 21m;
        resolver 127.0.0.11 valid=10s ipv6=off;
        set $api_upstream http://api:8000;
        proxy_pass $api_upstream$request_uri;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $http_host;
        proxy_read_timeout 660s;
    }
    location ^~ /api/conoscenza/ {
        client_max_body_size 21m;
        resolver 127.0.0.11 valid=10s ipv6=off;
        set $api_upstream http://api:8000;
        proxy_pass $api_upstream$request_uri;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $http_host;
        proxy_read_timeout 660s;
    }
    location ^~ /api/ {
        # The authenticated knowledge upload accepts 20 MiB of file data;
        # leave room for multipart framing while bounding proxy buffering.
        client_max_body_size 21m;
        resolver 127.0.0.11 valid=10s ipv6=off;
        set $api_upstream http://api:8000;
        proxy_pass $api_upstream$request_uri;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $http_host;
        proxy_read_timeout 60s;
    }

    location ^~ /webhooks/ {
        resolver 127.0.0.11 valid=10s ipv6=off;
        set $api_upstream http://api:8000;
        proxy_pass $api_upstream$request_uri;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $http_host;
        proxy_read_timeout 60s;
    }

    # Immagini/font: cache lunga (i nuovi asset cambiano nome file).
    location ~* \.(png|jpg|jpeg|gif|svg|webp|ico|woff2?)$ {
        include /etc/nginx/conf.d/security-headers.conf;
        expires 7d;
        add_header Cache-Control "public, max-age=604800, immutable";
    }

    # CSS/JS: cache corta e niente "immutable".
    location ~* \.(css|js)$ {
        include /etc/nginx/conf.d/security-headers.conf;
        expires 5m;
        add_header Cache-Control "public, max-age=300, must-revalidate";
    }

    # HTML sempre freschi: il ?v= invalida gli asset quando cambiano.
    location ~* \.html$ {
        include /etc/nginx/conf.d/security-headers.conf;
        add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate, max-age=0";
        expires 0;
    }

    location = /index.html {
        include /etc/nginx/conf.d/security-headers.conf;
        add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate, max-age=0";
        expires 0;
    }

error_page 404 /404.html;

access_log off;
}
