name: Migration check

on:
  push:
    branches: [main]
    paths:
      - "src/core/db/migrations/*.sql"
      - "src/core/db/schema.sql"
      - "src/core/db/triggers.sql"
      - "src/whatsapp/schema.sql"
  pull_request:
    paths:
      - "src/core/db/migrations/*.sql"
      - "src/core/db/schema.sql"
      - "src/core/db/triggers.sql"
      - "src/whatsapp/schema.sql"

jobs:
  validate:
    runs-on: ubuntu-latest
    env:
      GDPR_TEST_VALKEY_URL: redis://localhost:6379/15

    services:
      valkey:
        image: valkey/valkey:8-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "valkey-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      postgres:
        image: pgvector/pgvector:0.7.4-pg16
        env:
          POSTGRES_PASSWORD: test
          POSTGRES_DB: test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v4

      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/lib/android /usr/share/swift /usr/local/.ghcup
          sudo apt-get autoremove -y
          sudo apt-get clean

      - name: Install psql
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends postgresql-client

      - name: Create auth stubs (Supabase schema not available in vanilla Postgres)
        run: |
          PGPASSWORD=test psql -v ON_ERROR_STOP=1 -h localhost -U postgres -d test <<'EOSQL'
          CREATE SCHEMA IF NOT EXISTS auth;
          CREATE TABLE IF NOT EXISTS auth.users (
              id UUID PRIMARY KEY DEFAULT gen_random_uuid(),
              email TEXT
          );
          CREATE OR REPLACE FUNCTION auth.uid() RETURNS uuid AS $$
              SELECT NULL::uuid
          $$ LANGUAGE sql STABLE;
          CREATE OR REPLACE FUNCTION auth.jwt() RETURNS jsonb AS $$
              SELECT '{}'::jsonb
          $$ LANGUAGE sql STABLE;
          -- Ruoli client come su Supabase: le policy RLS li referenziano.
          DO $$ BEGIN
              IF NOT EXISTS (SELECT FROM pg_roles WHERE rolname = 'anon') THEN
                  CREATE ROLE anon NOLOGIN;
              END IF;
              IF NOT EXISTS (SELECT FROM pg_roles WHERE rolname = 'authenticated') THEN
                  CREATE ROLE authenticated NOLOGIN;
              END IF;
              IF NOT EXISTS (SELECT FROM pg_roles WHERE rolname = 'service_role') THEN
                  CREATE ROLE service_role NOLOGIN BYPASSRLS;
              END IF;
          END $$;
          EOSQL

      - name: Apply whatsapp schema
        run: PGPASSWORD=test psql -v ON_ERROR_STOP=1 -h localhost -U postgres -d test -f src/whatsapp/schema.sql

      - name: Apply core schema
        run: PGPASSWORD=test psql -v ON_ERROR_STOP=1 -h localhost -U postgres -d test -f src/core/db/schema.sql

      - name: Apply triggers
        run: PGPASSWORD=test psql -v ON_ERROR_STOP=1 -h localhost -U postgres -d test -f src/core/db/triggers.sql

      - name: Configure test database search_path
        run: |
          PGPASSWORD=test psql -v ON_ERROR_STOP=1 -h localhost -U postgres -d test <<'EOSQL'
          CREATE SCHEMA IF NOT EXISTS extensions;
          ALTER DATABASE test SET search_path TO public, extensions;
          ALTER ROLE postgres SET search_path TO public, extensions;
          EOSQL

      - name: Apply all migrations in order
        run: |
          for f in $(ls src/core/db/migrations/0*.sql | sort); do
            echo "--- Applying $f ---"
            PGPASSWORD=test psql -v ON_ERROR_STOP=1 -h localhost -U postgres -d test -f "$f"
          done

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('requirements.txt', 'scripts/reviewed_runtime.py', 'scripts/check_dependency_audit.py', 'scripts/bootstrap_reviewed_pip.py') }}

      - name: Bootstrap reviewed pip in disposable CI runner
        run: python scripts/bootstrap_reviewed_pip.py --isolated-build

      - name: Install dependencies
        run: python scripts/reviewed_runtime.py install

      - name: Generate ephemeral test encryption key
        run: |
          python - <<'PY'
          import os
          from cryptography.fernet import Fernet

          key = Fernet.generate_key().decode("ascii")
          with open(os.environ["GITHUB_ENV"], "a", encoding="utf-8") as env_file:
              env_file.write(f"ENCRYPTION_KEY={key}\n")
          print(f"::add-mask::{key}")
          PY

      - name: Run tests with service container
        env:
          CI: true
          PGUSER: postgres
          PGPASSWORD: test
          PGDATABASE: test
          PGHOST: localhost
          PGPORT: 5432
        run: pytest -v --tb=short -x
