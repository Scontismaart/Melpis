services:
  api:
    build: .
    image: whatsapp-ai-responder:latest
    command: [uvicorn, src.api.main:app, --host, 0.0.0.0, --port, "8000", --no-proxy-headers, --no-access-log]
    env_file: .env
    ports:
      - "8000:8000"
    volumes:
      - ./src:/app/src
      - chroma_data:/app/data/chroma
    networks:
      - app_internal
    restart: unless-stopped
    mem_limit: 1g
    cpus: "1.0"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/health"]
      interval: 30s
      timeout: 10s
      start_period: 30s
      retries: 5
    depends_on:
      valkey:
        condition: service_started

  web:
    build:
      context: ./web
      dockerfile: Dockerfile
    image: whatsapp-ai-responder-web:latest
    # Local development has no reviewed legal identity values. Keep the
    # production legal renderer enabled in compose.production.yml; here serve
    # the dashboard while the legal templates remain outside the document root.
    entrypoint: ["/bin/sh", "-c"]
    command: ["exec nginx -g 'daemon off;'"]
    ports:
      - "8080:80"
      # Keep the local QA URL on the Compose network so nginx can resolve api.
      - "127.0.0.1:4174:80"
    volumes:
      - ./web/landing/index.html:/usr/share/nginx/html/index.html:ro
      - ./web/landing/style.css:/usr/share/nginx/html/style.css:ro
      - ./web/landing/app.js:/usr/share/nginx/html/app.js:ro
      - ./web/landing/panoramica.webp:/usr/share/nginx/html/panoramica.webp:ro
      - ./web/landing/conoscenza.webp:/usr/share/nginx/html/conoscenza.webp:ro
      - ./web/landing/prenotazioni.webp:/usr/share/nginx/html/prenotazioni.webp:ro
      - ./web/landing/inbox.webp:/usr/share/nginx/html/inbox.webp:ro
      - ./web/landing/brand:/usr/share/nginx/html/brand:ro
      - ./web/landing/sfondoherosction.webp:/usr/share/nginx/html/sfondoherosction.webp:ro
      - ./web/landing/sitemap.xml:/usr/share/nginx/html/sitemap.xml:ro
      - ./web/landing/settori:/usr/share/nginx/html/settori:ro
      - ./web/landing/prezzi:/usr/share/nginx/html/prezzi:ro
      - ./web/landing/documentazione:/usr/share/nginx/html/documentazione:ro
      - ./web/landing/fonts:/usr/share/nginx/html/fonts:ro
      - ./web/landing/navbar.js:/usr/share/nginx/html/navbar.js:ro
      - ./web/landing/og-image-universal.jpg:/usr/share/nginx/html/og-image-universal.jpg:ro
      - ./web/locales:/usr/share/nginx/html/locales:ro
      - ./web/i18n-client.js:/usr/share/nginx/html/i18n-client.js:ro
      - ./web/inline-assets:/usr/share/nginx/html/inline-assets:ro
      - ./web/index.html:/usr/share/nginx/html/app/index.html:ro
      - ./web/style.css:/usr/share/nginx/html/app/style.css:ro
      - ./web/app.js:/usr/share/nginx/html/app/app.js:ro
      - ./web/dashboard-shared.js:/usr/share/nginx/html/app/dashboard-shared.js:ro
      - ./web/dashboard-inbox.js:/usr/share/nginx/html/app/dashboard-inbox.js:ro
      - ./web/dashboard-router.js:/usr/share/nginx/html/app/dashboard-router.js:ro
      - ./web/dashboard-overview.js:/usr/share/nginx/html/app/dashboard-overview.js:ro
      - ./web/dashboard-reviews.js:/usr/share/nginx/html/app/dashboard-reviews.js:ro
      - ./web/dashboard-knowledge.js:/usr/share/nginx/html/app/dashboard-knowledge.js:ro
      - ./web/dashboard-team.js:/usr/share/nginx/html/app/dashboard-team.js:ro
      - ./web/dashboard-ai-simulator.js:/usr/share/nginx/html/app/dashboard-ai-simulator.js:ro
      - ./web/dashboard-bookings.js:/usr/share/nginx/html/app/dashboard-bookings.js:ro
      - ./web/mfa.js:/usr/share/nginx/html/app/mfa.js:ro
      - ./web/config.js:/usr/share/nginx/html/config.js:ro
      - ./web/auth.js:/usr/share/nginx/html/auth.js:ro
      - ./web/login.js:/usr/share/nginx/html/login.js:ro
      - ./web/login.html:/usr/share/nginx/html/login.html:ro
      - ./web/register.js:/usr/share/nginx/html/register.js:ro
      - ./web/register.html:/usr/share/nginx/html/register.html:ro
      - ./web/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    networks:
      - app_internal
    restart: unless-stopped
    mem_limit: 256m
    cpus: "0.5"
    depends_on:
      - api

  valkey:
    image: valkey/valkey:8-alpine
    command: ["valkey-server", "--appendonly", "yes"]
    volumes:
      - valkey_data:/data
    networks:
      - app_internal
    restart: unless-stopped
    mem_limit: 128m
    cpus: "0.1"
    healthcheck:
      test: ["CMD", "valkey-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  backup-drill:
    build: .
    image: whatsapp-ai-responder:latest
    env_file: .env
    command: ["python", "run_backup_restore_drill.py"]
    volumes:
      - backups:/app/backups
    networks:
      - app_internal
    restart: unless-stopped
    mem_limit: 256m
    cpus: "0.2"
    healthcheck:
      disable: true
    depends_on:
      api:
        condition: service_healthy

  worker-inbound:
    build: .
    image: whatsapp-ai-responder:latest
    env_file: .env
    command: ["python", "run_inbound_processor.py"]
    volumes:
      - ./src:/app/src
      - chroma_data:/app/data/chroma
    networks:
      - app_internal
    restart: unless-stopped
    mem_limit: 512m
    cpus: "0.5"
    healthcheck:
      disable: true
    depends_on:
      api:
        condition: service_healthy

  worker-retry:
    build: .
    image: whatsapp-ai-responder:latest
    env_file: .env
    command: ["python", "run_retry_worker.py"]
    volumes:
      - ./src:/app/src
      - chroma_data:/app/data/chroma
    networks:
      - app_internal
    restart: unless-stopped
    mem_limit: 256m
    cpus: "0.3"
    healthcheck:
      disable: true
    depends_on:
      api:
        condition: service_healthy

  # Audit 4.2: rete di sicurezza indipendente dai worker che liberano i
  # claim stale. Se worker-inbound o worker-retry crashano, muore con
  # loro anche la LORO chiamata interna a reap_stale_claims -- questo
  # servizio esiste apposta per liberare comunque i claim bloccati anche
  # quando i worker che li hanno presi in carico non sono piu' vivi.
  supervisor:
    build: .
    image: whatsapp-ai-responder:latest
    env_file: .env
    command: ["python", "run_supervisor.py"]
    volumes:
      - ./src:/app/src
    networks:
      - app_internal
    restart: unless-stopped
    mem_limit: 128m
    cpus: "0.1"
    healthcheck:
      disable: true
    depends_on:
      api:
        condition: service_healthy

  postgres-dev:
    profiles: ["dev"]
    image: postgres:16
    environment:
      POSTGRES_USER: app
      POSTGRES_PASSWORD: devpassword
      POSTGRES_DB: whatsapp_ai
    ports:
      - "5433:5432"
    volumes:
      - pgdata_dev:/var/lib/postgresql/data
    networks:
      - app_internal
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U app -d whatsapp_ai"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped
    mem_limit: 512m
    cpus: "0.5"

networks:
  app_internal:
    driver: bridge
    # DB e' Supabase gestito esterno: nessun servizio DB/Redis locale da
    # isolare qui. La rete interna impedisce comunque che i worker siano
    # raggiungibili dall'esterno: solo 'api' pubblica una porta host.

volumes:
  chroma_data:
  pgdata_dev:
  valkey_data:
  backups:

# -- Nota secrets ------------------------------------------------------
# .env passato via env_file: NON finisce nell'immagine (e' in
# .dockerignore), iniettato solo a runtime nel container. Per deploy
# reale (Coolify/Fly.io/Railway/VPS+Swarm) sostituire env_file con il
# secret manager della piattaforma invece di portare il file .env sul
# server.
